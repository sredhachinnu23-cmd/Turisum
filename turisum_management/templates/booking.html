{% load static %}
{% include 'header.html' %}


<section class="booking-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div style="background: rgba(0,0,0,0.55); padding: 40px; border-radius: 15px; backdrop-filter: blur(5px); ">
                    <h1 style="text-align:center; color:white;"> Book Your Trip</h1>
                    <form class="form" action="" method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label text-white">Name</label>
                            <input type="text" name="user_name" class="form-control" placeholder="Enter Your Name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-white">Email</label>
                            <input type="email" name="user_email" class="form-control" placeholder="Enter Your Email" required>
                        </div>
                       

                        <div class="mb-3">
                            <label class="form-label text-white">Phone Number</label>
                            <input type="text" name="user_phone" class="form-control" placeholder="Enter Your Number" required>
                        </div>

                      <div>
                           <label class="form-label text-white">Destination</label>
                           <select name="user_destination" class="form-control" required>
                             <option value="" selected disabled>Choose your destination</option>

                             {% for i in pk_data %}
                                  <option value="{{ i.packagename }}">  {{ i.packagename }}  </option>
                             {% endfor %}
                            </select>
                      </div>
                        
                        
                        <div class="form-check mb-4">
                            <input class="form-check-input"  type="checkbox">
                            <label class="form-check-label ">
                                I agree to terms & conditions
                            </label>
                        </div>
                        <div class="text-center">
                            <button type="submit" class="btn btn-success px-5 py-2"> Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section><br><br><br><br>

{% include 'footer.html' %}
